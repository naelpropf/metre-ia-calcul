# Examen des dossiers neufs, reparti sur 20 machines (4 processeurs chacune), puis bilan.
# Se lance a chaque envoi de code dans outil/ (ou a la main : onglet Actions > examen > Run workflow).
# Les resultats sont ecrits dans resultats/<date>-<version>/ sur la branche main (ce dossier ne relance rien).
name: examen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["outil/**", ".github/workflows/examen.yml", "!outil/exercices_plans.py", "!outil/fiches_part.py", "!outil/objets_une.py", "!outil/pensee_dessinee.py", "!outil/purger_fiches_anciennes.py"]   # 28/11 : les scripts des fiches ne relancent pas l examen
permissions:
  contents: write
concurrency:
  group: examen
  cancel-in-progress: true
jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        k: [1, 2, 3, 4, 5, 6]   # 27/11 : GitHub en fait tourner 5 a 7 a la fois ; au-dela, les parts attendent leur tour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      # 27/11 : 2 pages a la fois (4 a la fois = chaque page 1,5 fois plus lente : 2 vrais coeurs dedoubles ?)
      - name: pages de la part ${{ matrix.k }}/6
        run: cd outil && nproc && python examen_parallele.py 2 ${{ matrix.k }}/6
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.k }}
          path: outil/sorties/neufs_v3/
          if-no-files-found: ignore
  bilan:
    needs: part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: outil/sorties/neufs_v3
          merge-multiple: true
      - run: cd outil && python test_neufs.py --bilan | tee ../bilan.txt
      - name: ranger les resultats dans le depot
        run: |
          D="resultats/$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          mkdir -p "$D" && cp outil/sorties/neufs_v3/*.json "$D"/ && cp bilan.txt "$D"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultats && git commit -q -m "resultats examen $D"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
